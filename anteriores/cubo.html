<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: white">
      <!-- Arriba -->
      <a-entity
        position="0 2.51 -4"
        rotation="-90 0 0"
        text="value: Nunca dejes de aprender; color: purple; align: center; width: 6"
      >
      </a-entity>
      <a-box position="0 2 -4" color="gold"></a-box>

      <!-- Abajo -->
      <a-box position="0 0 -4" color="lime"></a-box>
      <a-entity
        position="0 -0.51 -4"
        rotation="90 0 0"
        text="value: El esfuerzo trae recompensas; color: navy; align: center; width: 6"
      >
      </a-entity>

      <!-- Izquierda -->
      <a-box position="-1 1 -4" color="crimson"></a-box>
      <a-entity
        position="-1.51 1 -4"
        rotation="0 -90 0"
        text="value: Cree en ti; color: white; align: center; width: 4"
      ></a-entity>

      <!-- Derecha -->
      <a-box position="1 1 -4" color="deepskyblue"></a-box>
      <a-entity
        position="1.51 1 -4"
        rotation="0 90 0"
        text="value: Prohibido rendirse; color: black; align: center; width: 4"
      ></a-entity>

      <!-- Frente -->
      <a-box position="0 1 -3" color="mediumorchid"></a-box>
      <a-entity
        position="0 1 -2.49"
        rotation="0 0 0"
        text="value: Hoy es un gran dia; color: white; align: center; width: 4"
      ></a-entity>

      <!-- Atrás -->
      <a-box position="0 1 -5" color="darkorange"></a-box>
      <a-entity
        position="0 1 -5.51"
        rotation="0 180 0"
        text="value: Todo comienza con un paso; color: black; align: center; width: 4"
      ></a-entity>

      <a-entity
        position="0 10 0"
        text="value: Bienvenido al mundo VR; width:10px; color: red; align:center;"
      ></a-entity>
    </a-scene>
  </body>
</html>
